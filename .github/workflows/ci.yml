name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src/ tests/ tools/ run_pipeline.py

      - name: Tests
        run: python -m pytest

      # The pipeline exits non-zero if any critical data-integrity or leakage check
      # fails, so running it is itself an end-to-end assertion.
      - name: Full pipeline
        run: python run_pipeline.py

      # Asserts that a clean run reproduces every committed number within numerical
      # tolerance, and that all artifacts were produced. This is deliberately not a byte
      # comparison: BLAS reduction order varies with library build and CPU, so two
      # correct runs can differ in the last bits of a float. The script prints the
      # largest difference it saw, so real drift is visible rather than absorbed.
      - name: Verify reproducibility
        run: python tools/check_reproducibility.py
