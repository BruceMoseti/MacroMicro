name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src/ tests/ tools/ run_pipeline.py

      - name: Tests
        run: python -m pytest

      # The pipeline exits non-zero if any critical data-integrity or leakage check
      # fails, so running it is itself an end-to-end assertion.
      - name: Full pipeline
        run: python run_pipeline.py

      # Every chart, table and document is generated deterministically from a seeded
      # dataset, so a clean run must reproduce the committed artifacts exactly. The
      # Excel workbook is excluded because openpyxl embeds a creation timestamp.
      - name: Verify reproducibility
        run: |
          git diff --stat -- outputs/charts outputs/tables docs
          if [ -n "$(git diff --name-only -- outputs/charts outputs/tables docs)" ]; then
            echo "::error::Regenerated artifacts differ from the committed ones."
            exit 1
          fi
          echo "All charts, tables and documents reproduced byte-for-byte."
